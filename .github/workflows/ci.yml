name: ChatPay Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'chatpay-backend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'chatpay-backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  typecheck-and-lint:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatpay-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: chatpay-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build TypeScript
        run: npm run build

      - name: Verify OpenAPI Export
        run: npm run export:openapi

  test:
    name: Automated Test Suite
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    defaults:
      run:
        working-directory: chatpay-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: chatpay_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: chatpay-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/chatpay_db
        run: npx prisma migrate deploy

      - name: Run Vitest Suite (Unit, Security, Auth, Decimals, Parser)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/chatpay_db
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long!
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          USDC_ASSET_CODE: USDC
          USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
          MAX_PAYMENT_CAP: 1000
          TRANSACTION_TIMEOUT_SECONDS: 300
        run: npm test

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "🚀 Triggering deployment on Render..."
            response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            http_code=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
            echo "Response: $response"
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "✅ Deployment triggered successfully on Render!"
            else
              echo "❌ Render deploy hook returned HTTP $http_code"
              exit 1
            fi
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret not configured. Skipping deploy step."
          fi
