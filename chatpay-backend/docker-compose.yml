version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatpay-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chatpay_db
    ports:
      - "5432:5432"
    volumes:
      - chatpay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatpay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chatpay_pgdata:
    driver: local
